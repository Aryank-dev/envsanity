name: "envsanity"
description: "Fail when code uses an environment variable that is not documented in .env.example"

inputs:
  path:
    description: "Path to scan"
    required: false
    default: "."
  example-file:
    description: "Path to the example env file"
    required: false
    default: ".env.example"
  strict:
    description: "Also fail on possibly unused variables (true/false)"
    required: false
    default: "false"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install envsanity
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        pip install "$ACTION_PATH"

    - name: Run envsanity
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_EXAMPLE_FILE: ${{ inputs.example-file }}
        INPUT_STRICT: ${{ inputs.strict }}
      run: |
        STRICT_FLAG=""
        if [ "$INPUT_STRICT" = "true" ]; then
          STRICT_FLAG="--strict"
        fi
        envsanity "$INPUT_PATH" --example "$INPUT_EXAMPLE_FILE" $STRICT_FLAG --format github
