[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "envsanity"
version = "0.1.0"
description = "Fails a pull request when code uses an environment variable that is not documented in .env.example"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "envsanity contributors" }]
keywords = ["env", "dotenv", "lint", "ci", "configuration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
envsanity = "envsanity.cli:main"

[project.urls]
Homepage = "https://github.com/Aryank-dev/envsanity"
Repository = "https://github.com/Aryank-dev/envsanity"
Issues = "https://github.com/Aryank-dev/envsanity/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "BLE"]
# The report deliberately uses ✖ ⚠ ℹ ✔ · ─ for readable output.
ignore = ["RUF001", "RUF002", "RUF003"]
